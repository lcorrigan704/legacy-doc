[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legacy-doc"
version = "0.1.2"
description = "Pure-Python text extraction for classic Microsoft Word .doc files."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Liam Corrigan" }
]
keywords = ["doc", "word", "ole", "text-extraction", "pure-python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "hatchling>=1.27",
    "pytest>=8",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/lcorrigan704/legacy-doc"
Repository = "https://github.com/lcorrigan704/legacy-doc"
Issues = "https://github.com/lcorrigan704/legacy-doc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/legacy_doc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
